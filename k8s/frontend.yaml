apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: autodevops
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: ghcr.io/chinmaya1999/infrapilot-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: autodevops
spec:
  selector: { app: frontend }
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: autodevops
  namespace: autodevops
spec:
  rules:
    - host: deploydojo.cmcloud.online
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: frontend, port: { number: 80 } } } }
    - host: api.cmcloud.online
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: backend, port: { number: 5001 } } } }
