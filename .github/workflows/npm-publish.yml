name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  # Images live in GitHub Container Registry: no separate registry password to manage
  BACKEND_IMAGE: ghcr.io/chinmaya1999/infrapilot-backend
  FRONTEND_IMAGE: ghcr.io/chinmaya1999/infrapilot-frontend

jobs:
  # Quality gate: nothing is built or deployed unless this passes
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Backend tests
        working-directory: backend
        run: npm ci && npm test
      - name: Frontend typecheck and build
        working-directory: frontend
        run: npm ci --legacy-peer-deps && npm run build
      - name: Validate learning guides (valid YAML/Nginx/Dockerfile blocks, no broken links)
        working-directory: frontend
        run: npm run check:content
      - name: Scan repo for vulnerabilities and committed secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-dirs: node_modules
          exit-code: '0'   # report-only for now; set to '1' once the backlog is clean
      - name: Dependency audit (high+)
        run: |
          (cd backend && npm audit --omit=dev --audit-level=high) || echo "::warning::backend audit found issues"
          (cd frontend && npm audit --omit=dev --audit-level=high) || echo "::warning::frontend audit found issues"

  # Build and Push Docker Images
  build-backend:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/Chinmaya1999/DevOps-project
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache,mode=max

  build-frontend:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/Chinmaya1999/DevOps-project
          cache-from: type=registry,ref=${{ env.FRONTEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.FRONTEND_IMAGE }}:buildcache,mode=max

  # Deploy to AWS EC2: pull, start, health-check, and roll back automatically if the new version is unhealthy
  deploy:
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Prepare environment payload
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
          CASHFREE_APP_ID: ${{ secrets.CASHFREE_APP_ID }}
          CASHFREE_SECRET_KEY: ${{ secrets.CASHFREE_SECRET_KEY }}
        run: |
          # Required secrets must exist, otherwise the backend refuses to start in production
          [ ${#JWT_SECRET} -ge 32 ] || { echo "::error::Repository secret JWT_SECRET is missing or shorter than 32 characters"; exit 1; }
          [[ "$DATA_ENCRYPTION_KEY" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "::error::Repository secret DATA_ENCRYPTION_KEY must be 64 hex characters"; exit 1; }
          {
            printf '%s\n' "$ENV_FILE" | grep -vE '^(JWT_SECRET|DATA_ENCRYPTION_KEY|NODE_ENV|TRUST_PROXY|FRONTEND_URL|API_PUBLIC_URL|COOKIE_SECURE|CASHFREE_APP_ID|CASHFREE_SECRET_KEY|CASHFREE_ENV)='
            echo "JWT_SECRET=$JWT_SECRET"
            echo "DATA_ENCRYPTION_KEY=$DATA_ENCRYPTION_KEY"
            echo "NODE_ENV=production"
            echo "TRUST_PROXY=1"
            echo "FRONTEND_URL=https://deploydojo.cmcloud.online"
            echo "API_PUBLIC_URL=https://api.cmcloud.online"
            echo "COOKIE_SECURE=true"
            # Online payments (optional): enabled only when both repository secrets exist
            if [ -n "$CASHFREE_APP_ID" ] && [ -n "$CASHFREE_SECRET_KEY" ]; then
              echo "CASHFREE_APP_ID=$CASHFREE_APP_ID"
              echo "CASHFREE_SECRET_KEY=$CASHFREE_SECRET_KEY"
              echo "CASHFREE_ENV=production"
            fi
          } > env.prod
          B64=$(base64 -w0 env.prod)
          echo "::add-mask::$B64"
          echo "ENV_B64=$B64" >> "$GITHUB_ENV"
          rm env.prod

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          ENV_B64: ${{ env.ENV_B64 }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: ENV_B64,GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            set -u
            BACKEND=${{ env.BACKEND_IMAGE }}
            FRONTEND=${{ env.FRONTEND_IMAGE }}

            # 1. Download new images BEFORE touching the running site (short-lived token, removed afterwards)
            printf '%s' "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_USER" --password-stdin
            sudo docker pull $BACKEND:latest
            sudo docker pull $FRONTEND:latest
            sudo docker logout ghcr.io >/dev/null

            # 2. Write the environment file (kept private to this user)
            umask 077
            mkdir -p "$HOME/app-env"
            printf '%s' "$ENV_B64" | base64 -d > "$HOME/app-env/backend.env"

            # 3. Remember what is running now, so we can roll back
            PREV_BACKEND=$(sudo docker inspect -f '{{.Image}}' backend 2>/dev/null || true)
            PREV_FRONTEND=$(sudo docker inspect -f '{{.Image}}' frontend 2>/dev/null || true)

            start_backend() { sudo docker run -d --name backend --restart unless-stopped -p 5001:5001 --env-file "$HOME/app-env/backend.env" "$1"; }
            start_frontend() { sudo docker run -d --name frontend --restart unless-stopped -p 3000:80 "$1"; }

            # 4. Swap containers
            sudo docker rm -f backend frontend >/dev/null 2>&1 || true
            start_backend $BACKEND:latest
            start_frontend $FRONTEND:latest

            # 5. Wait up to 90 s for the backend health endpoint
            OK=0
            for i in $(seq 1 45); do
              if curl -fsS http://localhost:5001/health >/dev/null 2>&1; then OK=1; break; fi
              sleep 2
            done

            if [ "$OK" = "1" ] && curl -fsI http://localhost:3000 >/dev/null 2>&1; then
              echo "Deploy healthy."
              sudo docker image prune -f >/dev/null
              sudo docker ps
              exit 0
            fi

            # 6. Unhealthy: show why, then restore the previous version
            echo "::error::New version is unhealthy. Backend logs:"
            sudo docker logs --tail 60 backend || true
            sudo docker rm -f backend frontend >/dev/null 2>&1 || true
            if [ -n "$PREV_BACKEND" ]; then
              echo "Rolling back to the previous version..."
              start_backend "$PREV_BACKEND"
              [ -n "$PREV_FRONTEND" ] && start_frontend "$PREV_FRONTEND"
            fi
            sudo docker ps
            exit 1
