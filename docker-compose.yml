services:
  frontend:
    image: awsmallick1999/infrapilot-frontend:latest
    container_name: frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    image: awsmallick1999/infrapilot-backend:latest
    container_name: backend
    restart: always
    ports:
      - "5001:5001"
    # All secrets (JWT_SECRET, OAuth client IDs/secrets, SMTP, ...) live in .env — see backend/.env.example
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/mernapp
    depends_on:
      - mongodb
    networks:
      - app-network

  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: always
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge
