services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - PORT=3000
    # 127.0.0.1 = reachable only from this server. Nginx (on the server) is the public front door.
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
