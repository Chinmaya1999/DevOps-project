server {
    listen 80;
    server_name localhost;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Monaco editor loads from jsDelivr; API + websocket go to api.cmcloud.online
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://sdk.cashfree.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; media-src 'self'; connect-src 'self' https://api.cmcloud.online wss://api.cmcloud.online https://cdn.jsdelivr.net https://*.cashfree.com; worker-src 'self' blob:; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://*.cashfree.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://*.cashfree.com; object-src 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # NOTE: no add_header inside location blocks — nginx would then drop the server-level security headers.
    # Hashed build assets are immutable
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        expires -1;   # index.html must always be revalidated
        try_files $uri $uri/ /index.html;
    }

    # never serve dotfiles / source maps
    location ~ /\.            { deny all; }
    location ~ \.map$         { deny all; }
}
